<script>
const Q="Can you introduce yourself?";

SETS.ch1.forEach(p=>{p.q=Q;p.t=p.own?"Hello, I am ___, I am from ___, I am good at ___.":`Hello, I am ${p.n}, I am from ${p.f}, I am good at ${p.s}.`});
["doctor","cook","driver","singer","student","teacher"].forEach(w=>{
 SETS.ch2.push({q:`Are you a ${w}?`,t:"Yes, I am.",w,h:"Answer yes.",wo:"The order is off. Think about how this conversation goes, then try again."});
 SETS.ch2.push({q:`Are you a good ${w}?`,t:`No, I'm not a good ${w}.`,w,h:"Answer no, and say you are not good at it.",wo:"The order is off. Think about how this conversation goes, then try again."})});
SETS.ch3=[];
["girl","boy","captain","doctor","carpenter","photographer"].forEach(w=>{const wo="The order is off. Think about how this conversation goes, then try again.";
 SETS.ch3.push({q:`You aren’t a bad ${w}.`,t:`Yes, I am. I'm a very bad ${w}.`,w,h:1,wo});
 SETS.ch3.push({q:"No, you aren’t.",t:"Yes, I am!",w,h:1,wo})});
["ch2","ch3"].forEach(k=>SETS[k].forEach(p=>p.sp="B"));
SETS.ch2p=[];SETS.ch3p=[];
{const wo="The order is off. Think about how this conversation goes, then try again.";
["doctor","cook","driver","singer","student","teacher"].forEach(w=>[[`Are you a ${w}?`,"A"],["Yes, I am.","B"],[`Are you a good ${w}?`,"A"],[`No, I'm not a good ${w}.`,"B"]].forEach(([t,sp])=>SETS.ch2p.push({t,w,h:1,pr:1,sp,wo})));
["girl","boy","captain","doctor","carpenter","photographer"].forEach(w=>[[`You aren't a bad ${w}.`,"A"],[`Yes, I am. I'm a very bad ${w}.`,"B"],["No, you aren't.","A"],["Yes, I am!","B"],[`No, you're not. You are a good ${w}.`,"A"]].forEach(([t,sp])=>SETS.ch3p.push({t,w,h:1,pr:1,sp,wo})))}
const art=w=>/^[aeiou]/i.test(w)?"an":"a";
const WO="The order is off. Think about how this conversation goes, then try again.";
SETS.ch4=[["Aya Kato","nurse","Yokohama","She"],["Shiro Goto","comedian","Osaka","He"],["Maria Solocova","tennis player","Russia","She"],["Yamanobori","sumo wrestler","Mongolia","He"],["Helen McDonald","movie star","the U.K.","She"],["Chan Park","actor","Korea","He"]].map(([n,j,f,H])=>({q:"Who is this?",t:`This is ${n}. ${H} is ${art(j)} ${j}. ${H}'s from ${f}. ${H}'s`,nm:n,rows:[["Name",n],["Job",j],["From",f]],note:"Describe this person. Then add one more thing about them:",wo:"The order is off. Think: who they are, their job, where they\u2019re from, then one more thing."}));
function mkSets(key,items,fn){SETS[key]=[];SETS[key+"p"]=[];items.forEach(it=>{const ts=fn(it);ts.forEach((x,i)=>{SETS[key+"p"].push({...x,pr:1,wo:WO});if(x.sp==="B")SETS[key].push({...x,q:ts[i-1].t,wo:WO})})})}
mkSets("ch5",[["Mike","he","coach","soccer coach","baseball coach"],["Leona","she","singer","pop singer","rock singer"],["Mr. Wilson","he","teacher","music teacher","English teacher"],["Kate","she","writer","mystery writer","science fiction writer"],["Johnny","he","actor","stage actor","movie actor"],["Ms. Brown","she","designer","fashion designer","book designer"]],([n,h,j,a,b])=>{const H=h==="he"?"He":"She";return[{sp:"A",t:`Is ${n} ${art(j)} ${j}?`,ws:[n,j],nm:n},{sp:"B",t:`Yes, ${h} is.`,ws:[n]},{sp:"A",t:`Is ${h} ${art(a)} ${a}?`,ws:[a]},{sp:"B",t:`No, ${h} isn't. ${H}'s ${art(b)} ${b}.`,ws:[b]}]});
mkSets("ch6",[["desk","table"],["pen","pencil"],["school","library"],["ship","boat"],["pot","pan"],["bookcase","cabinet"]],([a,b])=>[{sp:"A",t:`Is this ${art(a)} ${a}?`,ws:[a]},{sp:"B",t:"Yes, it is.",ws:[]},{sp:"A",t:`Is that ${art(a)} ${a}, too?`,ws:[a]},{sp:"B",t:`No, it isn't. It's ${art(b)} ${b}.`,ws:[b]}]);
mkSets("ch7",[["books","notebooks"],["bicycles","motorcycles"],["dolphins","whales"],["peaches","plums"],["towels","blankets"],["trains","trams"]],([a,b])=>[{sp:"A",t:`Are these ${a}?`,ws:[a]},{sp:"B",t:"Yes, they are.",ws:[]},{sp:"A",t:`Are those ${a}, too?`,ws:[a]},{sp:"B",t:`No, they aren't. They're ${b}.`,ws:[b]}]);
mkSets("ch8",[["a high school","a university"],["a guitar","a ukulele"],["salt","pepper"],["an orange","a grapefruit"],["a coffee shop","a restaurant"],["beer","oolong tea"]],([a,b])=>[{sp:"A",t:"What's this?",ws:[]},{sp:"B",t:`It's ${a}.`,ws:[a]},{sp:"A",t:"What's that?",ws:[]},{sp:"B",t:`It's ${b}.`,ws:[b]}]);
const cap=w=>w[0].toUpperCase()+w.slice(1);
mkSets("ch9",[["sad","happy"],["cold","hot"],["hungry","thirsty"],["sick","nervous"],["angry","excited"],["sleepy","bored"]],([a,b])=>[{sp:"A",t:`Are you ${a}?`,ws:[a]},{sp:"B",t:"No, we aren't.",ws:[]},{sp:"A",t:"You aren't?",ws:[]},{sp:"B",t:`No. We're ${b}.`,ws:[b]}]);
mkSets("ch10",[["your","My","my","Thomas","Tom"],["your Spanish teacher\u2019s","Her","her","Patricia","Pat"],["your father\u2019s","His","his","Robert","Bob"],["your mother\u2019s","Her","her","Catherine","Cathy"],["your brother\u2019s","His","his","William","Bill"],["your sister\u2019s","Her","her","Nancy","Ann"]],([who,P2,p2,name,nick])=>[{sp:"A",t:`May I ask ${who} name?`,ws:[who]},{sp:"B",t:`${P2} name is ${name}.`,ws:[name],nm:name},{sp:"A",t:`What's ${who==="your"?"your":p2} nickname?`,ws:[]},{sp:"B",t:`${P2} nickname is ${nick}.`,ws:[nick],nm:nick}]);
mkSets("ch11",[["your mother","loud","quiet","She","loud"],["your bed","big","small","It","big"],["their school","new","old","It","old"],["your father\u2019s car","fast","slow","It","slow"],["our homework","difficult","easy","It","difficult"],["Tim and Sam\u2019s room","tidy","messy","It","messy"]],([sb,a,b,P2,ans])=>[{sp:"A",t:`Is ${sb} ${a} or ${b}?`,ws:[sb,a,b],nm:/^Tim/.test(sb)?"Tim Sam's":undefined},{sp:"B",t:`${P2}'s ${ans}.`,ws:[ans]}]);
SETS.ch12=[["your mother","She","thirty-nine"],["John\u2019s brother","He","sixteen"],["Kate\u2019s sister","She","eleven"],["her grandfather","He","seventy-three"],["his grandmother","She","sixty-eight"]].map(([w,H,age])=>({q:`How old is ${w}?`,t:`${H}'s ${age} years old.`,ws:[age],wo:"The order is off. Think about how this conversation goes, then try again."}));
SETS.ch12.push({q:"How old are you?",t:"I'm years old.",rows:[["About","you"]],note:"Say your own age:",wo:"The order is off. Think about how this conversation goes, then try again."});
mkSets("ch13",[["this man","is","he","He's","Mr. Gandhi","India","He"],["that boy","is","he","That's","Paulo","Brazil","He"],["this girl","is","she","That's","Lee","China","She"],["these girls","are","they","They're","Sheila and Stacy","Kenya","They"],["those people","are","they","They're","Mr. and Mrs. Palmer","the U.K.","They"],["these men","are","they","They're","the Beatles","Liverpool, the U.K.","They"]],([who,v,pr,b1,name,place,P2])=>[{sp:"A",t:`Who ${v} ${who}?`,ws:[who]},{sp:"B",t:`${b1} ${name}.`,ws:[name],nm:name},{sp:"A",t:`Where ${v} ${pr} from?`,ws:[]},{sp:"B",t:`${P2==="They"?"They're":P2+"'s"} from ${place}.`,ws:[place]}]);
mkSets("ch14",[["bag",0,"Jenny\u2019s","hers"],["camera",0,"Mr. McDonald\u2019s","his"],["textbook",0,"yours","yours"],["dictionary",0,"mine","mine"],["balls",1,"ours","ours"],["umbrellas",1,"Mr. and Ms. Johnson\u2019s","theirs"]],([th,pl,o1,o2])=>[{sp:"A",t:`Whose ${th} ${pl?"are these":"is this"}?`,ws:[th]},{sp:"B",t:`${pl?"They're":"It's"} ${o1}.`,ws:[o1],nm:/^[A-Z]/.test(o1)?o1:undefined},{sp:"A",t:"Are you sure?",ws:[]},{sp:"B",t:`I think ${pl?"they're":"it's"} ${o2}.`,ws:[o2]}]);
{const wo2="The order is off. Think: name, where you live, then what you speak.",wo3="The order is off. Think: what you eat, read and watch.";
[["Marina","Spain","Spanish"],["Pierre","France","French"],["Johan","Germany","German"],["Castelo","Portugal","Portuguese"],["Ivan","Russia","Russian"],["Phan","Vietnam","Vietnamese"]].forEach(([n,c,l])=>{(SETS.ch15=SETS.ch15||[]).push({q:"Tell me about yourself.",t:`My name is ${n}. I live in ${c}. I speak ${l}.`,nm:n,rows:[["Name",n],["Country",c],["Language",l]],note:"Introduce yourself as this person:",wo:wo2},{q:"What else can you tell me?",t:`I eat ${l} food. I read ${l} books. I watch ${l} movies.`,ws:[l],wo:wo3})});
[["Takeru","Japan","Japanese","He"],["So-yun","Korea","Korean","She"],["Columbo","Italy","Italian","He"],["Osman","Turkey","Turkish","He"],["Chulalongkorn","Thailand","Thai","He"],["Julie","Denmark","Danish","She"]].forEach(([n,c,l,H])=>{(SETS.ch17=SETS.ch17||[]).push({q:"Can you tell me about this person?",t:`${H==="He"?"His":"Her"} name is ${n}. ${H} lives in ${c}. ${H} speaks ${l}.`,nm:n,rows:[["Name",n],["Country",c],["Language",l]],note:"Describe this person:",wo:wo2},{q:"What else can you tell me?",t:`${H} eats ${l} food. ${H} reads ${l} books. ${H} watches ${l} movies.`,ws:[l],wo:wo3})})}
mkSets("ch16",[["you","I","milk","drink milk","drink"],["you","I","math","study math","study"],["they","they","badminton","play badminton","play"],["you and Akira","we","kendo","practice kendo","practice"],["you and your brother","we","the newspaper","read the newspaper","read"],["Jack and Nancy","they","this radio program","listen to this radio program","listen to"]],([sb,p,ob,vp,vb])=>[{sp:"A",t:`Do ${sb} like ${ob}?`,ws:sb==="you"?[ob]:[sb,ob],nm:/^Jack/.test(sb)?"Jack Nancy":(/Akira/.test(sb)?"Akira":undefined)},{sp:"B",t:`Yes, ${p} do.`,ws:[]},{sp:"A",t:`Then do ${sb} ${vp} every day?`,ws:[vp]},{sp:"B",t:`No, ${p} don't. ${cap(p)} don't ${vb} it every day.`,ws:[vb]}]);
mkSets("ch18",[["Peter","he","orange juice","drink orange juice","drink"],["Helen","she","basketball","practice basketball","practice"],["Mr. White","he","coffee","make coffee","make"],["Billy","he","bungee jumping","bungee jump",""],["your brother","he","sunglasses","wear sunglasses","wear"],["your sister","she","bacon and eggs","cook bacon and eggs","cook"]],([sb,p,ob,vp,vb])=>[{sp:"A",t:`Does ${sb} like ${ob}?`,ws:[sb,ob],nm:/^[A-Z]/.test(sb)?sb:undefined},{sp:"B",t:`Yes, ${p} does.`,ws:[]},{sp:"A",t:`Then does ${p} ${vp} every day?`,ws:[vp]},{sp:"B",t:vb?`No, ${p} doesn't. ${cap(p)} doesn't ${vb} it every day.`:`No, ${p} doesn't. ${cap(p)} doesn't ${vp} every day.`,ws:[vb||vp]}]);
mkSets("ch20",[["speak English","speak Japanese"],["go to bed","watch movies"],["do your homework","play video games"],["clean your room","go out today"],["read the newspaper","read the magazine"],["eat your vegetables","push away the cucumber"]],([a,b])=>[{sp:"A",t:`${cap(a)}.`,ws:[a]},{sp:"B",t:"Well, OK.",ws:[]},{sp:"A",t:`Don't ${b}.`,ws:[b]},{sp:"B",t:"Oh, no!",ws:[]}]);
mkSets("ch21",[["hot","eat ice cream"],["sick","go to the hospital"],["hungry","go to a hamburger shop"],["thirsty","drink some juice"],["sleepy","go home"],["angry","punch this punching bag"]],([a,b])=>[{sp:"A",t:`Are you ${a}?`,ws:[a]},{sp:"B",t:"Yes, I am.",ws:[]},{sp:"A",t:`Me, too. Let's ${b}.`,ws:[b]},{sp:"B",t:"That's a good idea.",ws:[]}]);
mkSets("ch22",[["Do you like your sister?","Yes, I do. I like her and she likes me.","So you like each other.","Yes, we do.",["your sister"]],["Does Lucy like you?","Yes, she does. She likes me and I like her.","So you like each other.","Yes, we do.",["Lucy"],"Lucy"],["Does your uncle like his wife?","Yes, he does. He likes her and she likes him.","So they like each other.","Yes, they do.",["your uncle","his wife"]],["Does your aunt like her cats?","Yes, she does. She likes them and they like her.","So they like each other.","Yes, they do.",["your aunt","her cats"]],["Do you and Bob like Emma?","Yes, we do. We like her and she likes us.","So you like each other.","Yes, we do.",["you and Bob","Emma"],"Bob Emma"],["Do children like Santa Claus?","Yes, they do. They like him and he likes them.","So they like each other.","Yes, they do.",["children","Santa Claus"],"Santa Claus"]],([a,b,c,d,w,nm])=>[{sp:"A",t:a,ws:w,nm},{sp:"B",t:b,ws:[]},{sp:"A",t:c,ws:[]},{sp:"B",t:d,ws:[]}]);
mkSets("ch23",[["you","I","play shogi","play chess"],["you","I","sing well","dance well"],["your sister","she","do judo","do karate"],["Ted","he","drive a car","drive a bus"],["your brothers","they","ski","skate"],["you and Harry","we","swim","dive"]],([sb,p,a,b])=>[{sp:"A",t:`Can ${sb} ${a}?`,ws:sb==="you"?[a]:[sb,a],nm:(sb.match(/Ted|Harry/)||[])[0]},{sp:"B",t:`No, ${p} can't. Can you?`,ws:[]},{sp:"A",t:`Yes, I can. I can ${b}, too.`,ws:[b]},{sp:"B",t:`${cap(p)} can't ${b}, either.`,ws:[]}]);
const BE={I:["Are","No, I'm not.","What are you doing?","I am"],she:["Is","No, she isn't.","What is she doing?","She is"],he:["Is","No, he isn't.","What is he doing?","He is"],they:["Are","No, they aren't.","What are they doing?","They are"]};
mkSets("ch24",[["your sister","she","cook dinner","cooking dinner","wash the dishes","washing the dishes"],["Paul","he","do his homework","doing his homework","draw pictures","drawing pictures"],["Ms. Kelly","she","clear her desk","clearing her desk","prepare for the class","preparing for the class"],["you","I","look at stars","looking at stars","look for a UFO","looking for a UFO"],["Kate and Alex","they","study for the test","studying for the test","doze off","dozing off"],["you","I","put the machine together","putting the machine together","take it apart","taking it apart"]],([sb,p,a,ai,b,bi])=>{const[be,neg,wh,pos]=BE[p];return[{sp:"A",t:`${be} ${sb} ${ai}?`,ws:sb==="you"?[a]:[sb,a],nm:/^(Paul|Ms|Kate)/.test(sb)?sb:undefined},{sp:"B",t:neg,ws:[]},{sp:"A",t:wh,ws:[]},{sp:"B",t:`${pos} ${bi}.`,ws:[b]}]});
mkSets("ch26",[["you","I'm","in the dining room","vacuum","vacuuming"],["you","I'm","in my room","write a letter","writing a letter"],["Barbara","She's","in the living room","talk on the phone","talking on the phone"],["your father","He's","in his bedroom","run on the treadmill","running on the treadmill"],["you","I'm","in the basement","do the laundry","doing the laundry"],["the children","They're","in the yard","set up a tent","setting up a tent"]],([sb,P2,pl,b,bi])=>{const y=sb==="you",pw=P2==="She's"?"she":P2==="He's"?"he":"they";return[{sp:"A",t:y?"Where are you?":`Where ${pw==="they"?"are":"is"} ${sb}?`,ws:y?[]:[sb],nm:sb==="Barbara"?sb:undefined},{sp:"B",t:`${P2} ${pl}.`,ws:[pl]},{sp:"A",t:y?"What are you doing?":`What ${pw==="they"?"are":"is"} ${pw} doing?`,ws:[]},{sp:"B",t:`${P2} ${bi}.`,ws:[b]}]});

 S={view:"home",code:"",name:"",idx:0,takes:[],fb:null,listening:false,busy:false,err:"",room:null,sample:S.sample,mine:{},students:{},confirm:false};render()}
const sayBtn=w=>`<button class="s" style="padding:4px 10px" data-w="${esc(w)}" onclick="say(this.dataset.w)" aria-label="Hear ${esc(w)}">🔊</button>`;
function hintHTML(p){if(p.rows)return `<div class="mut" style="margin-top:12px">${p.note}</div><div class="hint">${p.rows.map(([l,w])=>`<div>${l}: <b>${w}</b> ${sayBtn(w)}</div>`).join("")}</div>`;
 const ws=p.ws;return ws.length?`<div class="mut" style="margin-top:12px">Your word${ws.length>1?"s":""}:</div><div class="hint">${ws.map(w=>`<b>${w}</b> ${sayBtn(w)}`).join(" &nbsp; ")}</div>`:""}
const rn=()=>(S.setKey.endsWith("p")?S.name+" & "+S.partner:S.name).slice(0,30);
const isGroup=()=>S.kind==="ch"&&GROUPW.includes("ch"+S.num);
function setMode(p){if(p){const v=(document.getElementById("pn").value||"").trim().slice(0,isGroup()?30:14);if(!v){S.err=isGroup()?"Enter your group members’ names.":"Enter your partner’s name.";return render()}S.partner=v;S.pair=true}else S.pair=false;S.modeSet=true;S.err="";start()}
function toHome(){if(S.rec){S.rec.onresult=S.rec.onerror=S.rec.onend=null;try{S.rec.abort()}catch(e){}}try{speechSynthesis.cancel()}catch(e){}S.view="home";S.test=false;S.idx=0;S.takes=[];S.fb=null;S.confirm=false;S.err="";S.listening=false;S.busy=false;render()}
function leave(){return S.test?toHome():home()}
function back(){const v=S.view;
 if(v==="quiz"){S.view="listen";return render()}
 if(v==="tpick"){if(S.room){S.view="teacher";return render()}return home()}
 if(v==="listen"||v==="done"||v==="wait"||v==="mode")return leave();
 if(v==="practice"){if(!S.confirm){S.confirm=true;return render()}S.confirm=false;return leave()}
 if(S.confirm)return home();S.confirm=true;render()}
const backBtn=()=>`<button class="s" onclick="back()">${S.confirm?"Leave? Progress will be lost. Tap again":S.view==="quiz"?"← Back":"← Menu"}</button>`;
const lessonName=l=>(l.kind==="ch"?"Chapter ":"Words and Phrases ")+l.num;
const avail=(k,n)=>k==="ch"?!!(SETS["ch"+n]&&SETS["ch"+n].length):k==="wp"?!!WPS[n]:false;
const links=(n,k,f)=>Array.from({length:n},(_,i)=>`<a href="#" class="lk${avail(k,i+1)?"":" off"}" onclick="${f}('${k}',${i+1});return false">${i+1}</a>`).join("");
function testPick(k,n){S.errT="";if(!avail(k,n)){S.errT="No tasks for "+lessonName({kind:k,num:n})+" yet.";return render()}S.test=true;S.modeSet=false;S.pair=false;S.name=S.name||"Tester";S.kind=k;S.num=n;start()}
function hostPick(k,n){if(!avail(k,n)){S.err="No tasks for "+lessonName({kind:k,num:n})+" yet. Pick a number that isn’t faded.";return render()}S.err="";if(S.room){S.lesson={kind:k,num:n};S.room.emit("lesson",S.lesson);S.view="teacher";render()}else teacher(k,n)}
function start(){if(S.rec){S.rec.onresult=S.rec.onerror=S.rec.onend=null;try{S.rec.abort()}catch(e){}}S.listening=false;S.busy=false;if(S.kind==="wp"&&WPS[S.num]){S.err="";S.view="listen";return render()}const key=S.kind+S.num;if(!SETS[key]||!SETS[key].length){S.err="No tasks for "+(S.kind==="ch"?"Chapter ":"Words and Phrases ")+S.num+" yet. Chapters 1 to 39 (except 19, 25, 28, 33, 35 and 36) and Words and Phrases 1 to 3 are available right now.";return render()}if(PAIRABLE.includes(key)&&!S.modeSet){S.view="mode";S.err="";return render()}const k2=PAIRABLE.includes(key)&&S.pair?key+"p":key;P=SETS[k2];S.setKey=k2;S.err="";S.view="practice";S.idx=0;S.takes=[];S.fb=null;render()}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const okey=o=>IMG[o.w]?"i"+o.w:o.e;
const pic=o=>(IMG[o.w]?`<img src="${IMG[o.w]}" alt="" width="56" height="56">`:`<span class="em">${o.e}</span>`)+(o.j?`<span class="jp">${o.j}</span>`:"");
function quizStart(){const all=WPS[S.num].flatMap(([t,l])=>l.split(";").map(x=>{const[w,e,j]=x.split("|");return{w,e,j}}));
 const qs=shuf(all).slice(0,10).map(c=>{const seen=new Set([okey(c)]),ds=[];for(const o of shuf(all)){if(!seen.has(okey(o))){seen.add(okey(o));ds.push(o);if(ds.length===3)break}}const opts=shuf([c,...ds]);return{w:c.w,opts,a:opts.indexOf(c)}});
 S.quiz={qs,i:0,score:0,p:null};S.view="quiz";render();setTimeout(()=>say(qs[0].w),250)}
function quizPick(j){const Z=S.quiz;if(Z.p!=null)return;Z.p=j;if(j===Z.qs[Z.i].a)Z.score++;render()}
function quizNext(){const Z=S.quiz;Z.i++;Z.p=null;render();if(Z.i<Z.qs.length)setTimeout(()=>say(Z.qs[Z.i].w),250)}
function say(w){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}
function speakWords(){const w=S.fb&&S.fb.words;if(!w||!w.length)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.join(", "));u.lang="en-US";u.rate=.7;speechSynthesis.speak(u)}
function speakQ(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(P[S.idx].q);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
function best(){return S.takes.reduce((a,b)=>b.total>a.total?b:a)}
function next(){S.confirm=false;const b=best();S.mine[S.setKey+":"+S.idx]={idx:S.idx,set:S.setKey,name:rn(),...b};
 if(S.room)S.room.emit("result",{name:rn(),set:S.setKey,idx:S.idx,total:b.total,p:b.p,i:b.i,g:b.g,issue:b.issue,heard:b.heard});
 S.idx++;S.takes=[];S.fb=null;if(S.idx>=P.length)S.view="done";render()}
async function getRoom(code){try{const r=await claude.use("room");return r?await r.join(code):null}catch(e){return null}}
async function teacher(k,n){S.lesson={kind:k,num:n};S.code=String(Math.floor(1000+Math.random()*9000));S.view="teacher";render();
 S.room=await getRoom(S.code);
 if(!S.room){S.err="Live sessions aren’t available on this page right now.";return render()}
 const add=(d,res)=>{const n=String(d&&d.name||"").slice(0,30).trim();if(!n)return;S.students[n]=S.students[n]||{};if(res){const k=+d.idx,sk=String(d.set||""),T=SETS[sk];if(T&&k>=0&&k<T.length)S.students[n][sk+":"+k]={total:+d.total||0,p:+d.p||0,i:+d.i||0,g:+d.g||0,issue:String(d.issue),heard:String(d.heard||"")}}render()};
 S.room.on("hello",m=>{add(m.data,false);S.room.emit("lesson",S.lesson)});S.room.on("result",m=>add(m.data,true));S.room.emit("sync");S.room.emit("lesson",S.lesson)}
async function join(){S.name=(document.getElementById("nm").value||"").trim().slice(0,30);const c=(document.getElementById("cd").value||"").trim();
 if(!S.name||!c){S.err="Please enter your name and the code.";return render()}
 S.err="";S.code=c;S.room=await getRoom(c);
 if(!S.room){S.err="Couldn’t join the session. Ask your teacher to open this page and check the code.";return render()}
 const hello=()=>{S.room.emit("hello",{name:S.name});Object.values(S.mine).forEach(r=>S.room.emit("result",{name:S.name,...r}))};
 S.room.on("sync",hello);
 S.room.on("lesson",m=>{const d=m.data||{},k=d.kind,n=+d.num;if((k==="ch"||k==="wp")&&n>=1&&n<=39&&avail(k,n)&&(S.view==="wait"||S.kind!==k||S.num!==n)){S.test=false;S.modeSet=false;S.pair=false;S.kind=k;S.num=n;start()}});
 hello();S.test=false;S.view="wait";render()}
const cls=n=>n>=75?"ok":n>=50?"warn":"bad";
const bar=(l,n)=>`<div><span>${l}</span><b class="${cls(n)}">${n}</b></div><div class="bar"><i style="width:${n}%"></i></div>`;
const MSG={
 katakana:()=>"It sounded like katakana English (−15). Try English sounds: don’t add extra vowels to the ends of words. Say it again.",
 pronunciation:f=>"Some words weren’t clear (−10)"+(f.words.length?": <b>"+f.words.map(esc).join(", ")+"</b>":"")+". Say those slowly and clearly, then record again.",
 word_order:()=>P[S.idx].wo?P[S.idx].wo:P[S.idx].own?"Follow the pattern in the box above: hello, your name, where you’re from, what you’re good at. Try again.":"The order is off or something is missing. Think: greeting, name, where you’re from, what you’re good at. Try again.",
 mumble:()=>"I couldn’t hear you clearly. Move closer to the microphone and speak a little louder.",
 ok:()=>"Nice work!"};
function render(){let h="";
 const err=S.err?`<p class="bad">${esc(S.err)}</p>`:"";
 if(S.view==="home")h=`<h1>Speaking Practice</h1><p class="mut">Nothing is saved. Closing the page clears everything.</p>
 <div class="card"><h2>I’m a teacher</h2><p class="mut">Choose a chapter and host it live. Share the code with your class.</p><button onclick="S.view='tpick';S.err='';render()">Choose a lesson &amp; start</button></div>
 <div class="card"><h2>I’m a student</h2><input id="nm" placeholder="Your name" autocomplete="off"><input id="cd" placeholder="Session code" inputmode="numeric" autocomplete="off"><button onclick="join()">Join</button>${err}</div>
 <div class="card"><h2>Microphone check</h2><p class="mut">Not working? Tap this to see why.</p><button class="s" onclick="micCheck()">Check my microphone</button>${S.mic?`<p>${S.mic.map(esc).join("<br>")}</p>`:""}</div>
 <div class="card"><h2>Test mode</h2><p class="mut">For checking tasks. Opens the student tasks directly. Nothing is sent to a teacher. Faded numbers have no tasks yet.</p><div class="mut">Chapters</div><div class="grid">${links(39,"ch","testPick")}</div><div class="mut">Words and Phrases</div><div class="grid">${links(9,"wp","testPick")}</div>${S.errT?`<p class="bad">${esc(S.errT)}</p>`:""}</div>`;
 else if(S.view==="teacher"){const names=Object.keys(S.students);
  h=`${backBtn()}<h1>Teacher view</h1><p class="mut">Hosting: <b>${lessonName(S.lesson)}</b> <button class="s" onclick="S.view='tpick';S.err='';render()">Change lesson</button></p><div class="card"><div class="mut">Session code</div><div class="code">${S.code}</div><p class="mut">Students enter this code and their name. Keep this tab open; results exist only while it is.</p>${err}</div>
  <div class="card tw"><h2>Best score per task</h2>${names.length?Object.keys(SETS).map(sk=>{const T=SETS[sk],rows=names.filter(n=>T.some((x,i)=>S.students[n][sk+":"+i]));if(!rows.length)return"";return `<h3>${LBL[sk]}</h3><table><tr><th>Student</th>${T.map((p,i)=>`<th>#${i+1}${p.pr?p.sp:""}</th>`).join("")}<th>Avg</th></tr>${rows.map(n=>{const r=S.students[n],v=T.map((p,i)=>r[sk+":"+i]).filter(Boolean),avg=Math.round(v.reduce((a,b)=>a+b.total,0)/v.length);return `<tr><td>${esc(n)}</td>${T.map((p,i)=>{const x=r[sk+":"+i];return x?`<td title="Heard: ${esc(x.heard)} | P${x.p} I${x.i} G${x.g}"><b class="${cls(x.total)}">${x.total}</b></td>`:"<td class='mut'>–</td>"}).join("")}<td><b>${avg}</b></td></tr>`}).join("")}</table>`}).join("")+`<p class="mut">Hover or tap a score to see what was heard and the pronunciation / intonation / grammar breakdown.</p>`:`<p class="mut">Waiting for students to join…</p>`}</div>`}
 else if(S.view==="quiz"){const Z=S.quiz;
  if(Z.i>=Z.qs.length)h=`${backBtn()}<h1>Your score</h1><div class="card"><div class="code">${Z.score} / ${Z.qs.length}</div><p>${Z.score===Z.qs.length?"Perfect! 🎉":Z.score>=Z.qs.length*.7?"Great job!":"Good try. Listen to the words again and have another go."}</p><button onclick="quizStart()">Try again</button><button class="s" onclick="S.view='listen';render()">Back to the words</button></div>`;
  else{const q=Z.qs[Z.i];h=`${backBtn()}<h1>Test yourself</h1><p class="mut">Question ${Z.i+1} of ${Z.qs.length} · Score ${Z.score}</p><div class="card"><p style="text-align:center">Listen, then choose the picture.</p><button class="play" onclick="say('${q.w}')" aria-label="Play the word"><svg viewBox="0 0 24 24" width="44" height="44" fill="#fff" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><div class="qg">${q.opts.map((o,j)=>`<button class="op${Z.p==null?"":j===q.a?" good":j===Z.p?" bad":""}" ${Z.p==null?"":"disabled"} onclick="quizPick(${j})">${pic(o)}</button>`).join("")}</div>${Z.p!=null?`<p class="${Z.p===q.a?"ok":"bad"}"><b>${Z.p===q.a?"Correct!":"Not quite."}</b> It was <b>${esc(q.w)}</b>.</p><button onclick="quizNext()">${Z.i+1<Z.qs.length?"Next →":"See score"}</button>`:""}</div>`}}
 else if(S.view==="listen"){let n=0;h=`${backBtn()}<h1>Words and Phrases ${S.num}</h1><p class="mut">Tap a picture to hear the word.</p><div class="card"><h2>Test yourself</h2><p class="mut">10 questions. Listen to the word, then choose the right picture.</p><button onclick="quizStart()">📝 Start the quiz</button></div>`+WPS[S.num].map(([t,l])=>`<div class="card">${t?`<h2>${t}</h2>`:""}<div class="wg">${l.split(";").map(x=>{const[w,e,j]=x.split("|");n++;return `<button class="wd" onclick="say('${w}')"><span class="nm">${n}</span><span class="em">${IMG[w]?`<img src="${IMG[w]}" alt="" width="48" height="48">`:e}</span><span>${w}</span>${j?`<span class="mut" style="font-size:12px">${j}</span>`:""}</button>`}).join("")}</div></div>`).join("")}
 else if(S.view==="mode")h=`${backBtn()}<h1>${lessonName({kind:S.kind,num:S.num})}</h1><div class="card"><h2>How do you want to practise?</h2><button onclick="setMode(0)">🤖 With the AI (you are Speaker B)</button></div>${isGroup()?`<div class="card"><h2>With a group</h2><p class="mut">Take turns. One student is Speaker A (red). The rest of the group is Speaker B (blue) and answers together. You start as Speaker A.</p><input id="pn" placeholder="Group members’ names, e.g. Ben, Aki" autocomplete="off"><button onclick="setMode(1)">👥 Start with a group</button>${err}</div>`:`<div class="card"><h2>With a partner</h2><p class="mut">Take turns as Speaker A (red) and Speaker B (blue). You start as Speaker A.</p><input id="pn" placeholder="Partner’s name" autocomplete="off"><button onclick="setMode(1)">👫 Start with a partner</button>${err}</div>`}`;
 else if(S.view==="wait")h=`${backBtn()}<h1>Hi, ${esc(S.name)}</h1><div class="card"><p>You’re in. Waiting for your teacher to start the lesson…</p>${err}</div>`;
 else if(S.view==="tpick")h=`${backBtn()}<h1>Choose the lesson to host</h1><p class="mut">Students who join with your code get this lesson only. Faded numbers have no tasks yet.</p><div class="card"><h2>Chapters</h2><div class="grid">${links(39,"ch","hostPick")}</div><h2 style="margin-top:18px">Words and Phrases</h2><div class="grid">${links(9,"wp","hostPick")}</div>${err}</div>`;
 else if(S.view==="practice"){const p=P[S.idx],n=S.takes.length,f=S.fb;
  h=`${p.sp?`<div class="bn ${p.sp==="A"?"ba":"bb"}">Speaker ${p.sp}${p.pr?` · ${esc(p.sp==="A"?S.name:S.partner)}`:" (you)"}</div>`:""}${backBtn()}<h1>Hi, ${esc(S.name)}</h1><p class="mut">${LBL[S.setKey]} · Task ${S.idx+1} of ${P.length} · Take ${Math.min(n+1,3)} of 3</p>
  <div class="card">${p.pr?`<div class="hint">${p.sp==="A"?"Say your line.":"Listen to your partner, then answer."}</div>`:`<button onclick="speakQ()">🔊 Hear the question</button><div class="hint">“${p.q}”</div>`}${p.rows||p.ws?hintHTML(p):p.h?`<div class="mut" style="margin-top:12px">Your word:</div><div class="hint"><b>${p.w}</b> <button class="s" style="padding:4px 10px" onclick="say('${p.w}')" aria-label="Hear ${p.w}">🔊</button></div>`:p.own?`<div class="mut" style="margin-top:12px">Your own script. Fill in the blanks about yourself:</div>`:`<div class="mut" style="margin-top:12px">Introduce yourself as this person:</div><div class="hint">${[["Name",p.n],["From",p.f],["Good at",p.s]].map(([l,w])=>`<div>${l}: <b>${w}</b> <button class="s" style="padding:4px 10px" onclick="say('${w}')" aria-label="Hear ${w}">🔊</button></div>`).join("")}</div>`}
  ${p.own?`<div class="hint pat">${p.t}</div>`:""}</div>`;
  if(S.listening)h+=`<div class="card"><p class="rec"><b>● Listening… speak now</b></p><button class="s" onclick="stopRec()">Done speaking</button></div>`;
  else if(S.busy)h+=`<div class="card"><p>Checking your speech…</p></div>`;
  else{
   if(f)h+=`<div class="card"><h2>Take ${n}: <span class="${cls(f.total)}">${f.total}</span> pts</h2><div class="mut">I heard: “${esc(f.heard||"…")}”</div><div class="bars">${bar("Pronunciation",f.p)}${bar("Intonation (estimate)",f.i)}${bar("Grammar",f.g)}</div><p class="${f.issue==="ok"?"ok":"warn"}">${MSG[f.issue](f)}</p>${f.tip?`<p class="mut">${esc(f.tip)}</p>`:""}</div>`;
   const can=n<3,okd=f&&f.issue==="ok";
   h+=`<div>${can?`<button onclick="record()">${n?"● Record again":"● Record"}</button>`:""}${f&&f.issue==="pronunciation"&&f.words.length?`<button class="s" onclick="speakWords()">🔊 Hear the unclear words</button>`:""}${n&&(!can||okd)?`<button onclick="next()">Keep best (${best().total}) &amp; next →</button>`:""}${n&&can&&!okd?`<button class="s" onclick="next()">Skip with best (${best().total})</button>`:""}</div>${err}`}}
 else h=`${backBtn()}<h1>All done, ${esc(S.name)}!</h1><div class="card">${P.map((p,i)=>`<div>Phrase ${i+1}${p.own?" (your own script)":""}: <b class="${cls(S.mine[S.setKey+":"+i].total)}">${S.mine[S.setKey+":"+i].total}</b></div>`).join("")}<p class="mut">Your best scores were sent to your teacher.</p></div>`;
 app.innerHTML=h}
render();
(async()=>{try{S.sample=await claude.use("sample")}catch(e){}})();
</script></body></html>
